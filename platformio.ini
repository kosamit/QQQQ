; PlatformIO Project Configuration File
; Board: LilyGo T4-S3 (ESP32-S3, 16MB Flash, 8MB PSRAM, AMOLED RM67162)
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32 @6.5.0
board = lilygo_t4_s3
framework = arduino
monitor_speed = 115200 ;Serial Baud Rate Setting

upload_speed = 115200 ;Native USB-CDC: avoid baud-rate change ("No serial data received")
upload_flags = --no-stub ;Native USB-CDC: stub re-enumerates USB and drops the connection
board_upload.flash_size = 16MB

board_build.memory_type = qio_opi ;8MB OPI PSRAM
board_build.partitions = default_16MB.csv

build_flags =
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=1 ;Debug level 0-5
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1 ;USB port as serial
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

lib_deps =
    https://github.com/lathoub/Arduino-BLE-MIDI.git
    fortyseveneffects/MIDI Library@^5.0.2
    h2zero/NimBLE-Arduino@^1.4.0
    adafruit/Adafruit seesaw Library@^1.7.8

[platformio]
boards_dir = ./boards
lib_dir = ./libraries

src_dir = src
; src_dir = tests/i2c_scan ;I2C scan test

[env:production]
; lib_ignore = Adafruit seesaw Library, WebServer ;I2C scan test

[env:touchtest]
; Touch calibration build: shows raw CST226SE coordinates on screen.
build_flags =
    ${env.build_flags}
    -D TOUCH_TEST
